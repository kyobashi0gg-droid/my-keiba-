function parseTime(x){if(x===null||x===undefined||String(x).trim()==='')return null;let t=String(x).normalize('NFKC').trim();let m=t.match(/^(\d+)[.:](\d{1,2})[.](\d+)$/);if(m){if(Number(m[2])>=60)return NaN;return Number(m[1])*60+Number(m[2]+'.'+m[3])}m=t.match(/^(\d+):(\d{1,2}(?:\.\d+)?)$/);if(m)return Number(m[2])<60?Number(m[1])*60+Number(m[2]):NaN;if(!/^\d+(?:\.\d+)?$/.test(t))return NaN;return Number(t)}
function timeText(n,total=false){if(n===null||n===undefined||n===''||!Number.isFinite(Number(n)))return '—';n=Number(n);if(total){let tenths=Math.round(n*10),min=Math.floor(tenths/600),sec=(tenths%600)/10;return min+':'+sec.toFixed(1).padStart(4,'0')}return n.toFixed(1)}
function timeDiff(a,b){return a==null||a===''||b==null||b===''||!Number.isFinite(Number(a))||!Number.isFinite(Number(b))?null:Math.round((Number(a)-Number(b))*10)/10}
function benchMini(r){let n=timeDiff(r.timeActual,r.timeBase);return n===null?'':'<span class="tag">時計差 '+fmt(n)+'秒</span>'}
function benchRows(r){let rows=[['走破タイム',r.timeBase,r.timeActual,true],['前半3F',r.front3Base,r.front3Actual,false],['前半5F',r.front5Base,r.front5Actual,false]];if(r.front6Base!=null||r.front6Actual!=null)rows.push(['旧・前半6F',r.front6Base,r.front6Actual,false]);if(r.frontOtherMeters||r.frontOtherBase!=null||r.frontOtherActual!=null)rows.push(['前半'+(r.frontOtherMeters?esc(r.frontOtherMeters)+'m':'（区間未確認）'),r.frontOtherBase,r.frontOtherActual,false]);rows.push(['上がり3F',r.last3Base,r.last3Actual,false]);return rows}
function benchPanel(r){return '<div class="benchGroup"><h3>新聞基準タイム比較</h3><p class="muted">良馬場平均等の新聞記載値。差＝実測−基準（秒）。マイナスは速い。空欄は未確認。</p><table class="benchTable"><thead><tr><th>区間</th><th>新聞基準</th><th>実測</th><th>差（秒）</th></tr></thead><tbody>'+benchRows(r).map(([label,b,a,total])=>{let d=timeDiff(a,b);return '<tr><td>'+label+'</td><td>'+timeText(b,total)+'</td><td>'+timeText(a,total)+'</td><td class="'+(d<0?'benchFast':d>0?'benchSlow':'')+'">'+fmt(d)+'</td></tr>'}).join('')+'</tbody></table>'+(r.benchSource?'<p class="muted">出典・条件：'+esc(r.benchSource)+'</p>':'')+'</div>'}
function readBench(raw){let out={};for(let k of BENCH_KEYS){if(!Object.prototype.hasOwnProperty.call(raw,k))continue;let n=parseTime(raw[k]);if(n!==null&&(!Number.isFinite(n)||n<=0))throw Error('基準・実測タイムは正の数値で入力してください：'+k);out[k]=n}if(out.frontOtherMeters!=null&&(!Number.isInteger(out.frontOtherMeters)||out.frontOtherMeters>=Number(raw.distance)||[600].includes(out.frontOtherMeters)))throw Error('その他前半区間は距離未満のm数を指定（600mは専用欄）');if((out.frontOtherBase!=null||out.frontOtherActual!=null)&&!out.frontOtherMeters)throw Error('その他前半タイムには対象区間mを指定してください');if(Object.hasOwn(raw,'benchSource'))out.benchSource=String(raw.benchSource??'');return out}
function benchFields(r){let f=(label,key)=>field(label,key,r[key],'text',false,'inputmode="decimal" placeholder="秒 または 1:45.3"');return '<div class="wide benchGroup"><h3>新聞基準タイム比較</h3><p class="muted">新聞にある値のみ入力。前半3F・5F以外は区間mを指定。走破時計は105.3／1:45.3／1.45.3に対応。</p></div>'+f('基準走破タイム','timeBase')+f('実測走破タイム','timeActual')+f('基準前半3F','front3Base')+f('実測前半3F','front3Actual')+f('基準前半5F（1000m）','front5Base')+f('実測前半5F（1000m）','front5Actual')+(r.front6Base!=null||r.front6Actual!=null?f('旧登録・基準前半6F','front6Base')+f('旧登録・実測前半6F','front6Actual'):'')+field('その他前半区間（m）','frontOtherMeters',r.frontOtherMeters,'number',true,'min="1" step="1" placeholder="例：1100"')+f('その他前半・基準','frontOtherBase')+f('その他前半・実測','frontOtherActual')+f('基準上がり3F','last3Base')+f('実測上がり3F','last3Actual')+field('新聞出典・基準条件','benchSource',r.benchSource,'text',true,'placeholder="鈴木ショータ新聞・良馬場平均"')}
const BIAS_TAGS=['前有利','差し有利','内有利','外有利','外差し有利','内前有利','内差し有利','外前有利'];
const BIAS_SCHEMA='KAIKO_BIAS_UPDATE_V1';
const biasTemplate={schema:BIAS_SCHEMA,updates:[{date:'YYYY-MM-DD',place:'福島',number:11,userBiasTags:['前有利','内有利'],userBiasNote:''}]};
function biasTags(r){return Array.isArray(r.userBiasTags)?r.userBiasTags.filter(t=>BIAS_TAGS.includes(t)):[]}
function biasChips(r){return biasTags(r).map(t=>'<span class="biasFlag">'+esc(t)+'</span>').join('')}
function biasPanel(r){let chips=biasChips(r);return chips||r.userBiasNote?'<div class="biasPanel"><h3>顕著な馬場バイアス <small>ユーザー指定</small></h3>'+chips+(r.userBiasNote?'<div class="biasNote">'+esc(r.userBiasNote)+'</div>':'')+'</div>':'<div class="muted" style="margin:9px 0">顕著な馬場バイアス（ユーザー指定）：未登録</div>'}
function biasFields(r){return '<div class="wide benchGroup"><h3>顕著な馬場バイアス（ユーザー指定）</h3><p class="muted">明示された傾向だけ選択。複数可。未選択は未登録であり、フラットとは限りません。</p><div class="checks">'+BIAS_TAGS.map(t=>'<label><input type="checkbox" name="userBiasTags" value="'+esc(t)+'" '+(biasTags(r).includes(t)?'checked':'')+'>'+esc(t)+'</label>').join('')+'</div></div>'+area('対象範囲・補足（任意）','userBiasNote',r.userBiasNote,'placeholder="例：当日の芝、午後のみ。内を通った先行馬が顕著に有利。"')}
function checkedBias(raw){if(!Array.isArray(raw)||raw.some(t=>!BIAS_TAGS.includes(t)))throw Error('馬場バイアスのタグを確認してください');return [...new Set(raw)]}
function biasDraft(v,base){if(!Array.isArray(v.updates)||!v.updates.length)throw Error('updates配列が必要です');let draft=JSON.parse(JSON.stringify(base)),seen=new Set();for(let p of v.updates){if(!p||!/^\d{4}-\d{2}-\d{2}$/.test(p.date)||!PLACES.includes(p.place)||!Number.isInteger(Number(p.number))||Number(p.number)<1||Number(p.number)>12)throw Error('対象の開催日・競馬場・Rを指定してください');let id=raceId(p),r=draft.find(x=>x.id===id);if(!r)throw Error('未登録レース：'+id);if(seen.has(id))throw Error('対象レース重複：'+id);seen.add(id);r.userBiasTags=checkedBias(p.userBiasTags);if(Object.hasOwn(p,'userBiasNote'))r.userBiasNote=String(p.userBiasNote??'')}return draft}
function importBias(v){let draft=biasDraft(v,db);if(!confirm(v.updates.length+'レースのユーザー指定馬場バイアスだけを更新しますか？'))return;db=draft;save();importText='';go('races');toast('馬場バイアスを更新しました')}
function arg(s){return esc(JSON.stringify(s))}
function plot(l){if(sum33(l)===null)return '<div class="muted">ラスト6Fのラップ未登録</div>';let lo=Math.floor(Math.min(...l)*2)/2,hi=Math.ceil(Math.max(...l)*2)/2;if(hi===lo)hi=lo+.5;const x=i=>42+i*51,y=v=>25+(hi-v)/(hi-lo)*78;return `<svg class="plot" viewBox="0 0 320 128" role="img" aria-label="ラスト6Fラップグラフ"><rect x="25" y="10" width="150" height="100" rx="5" fill="#e9f3ee"/><rect x="177" y="10" width="136" height="100" rx="5" fill="#fbf1de"/>${[lo,(lo+hi)/2,hi].map(v=>`<line x1="27" x2="307" y1="${y(v)}" y2="${y(v)}" stroke="#c6d5ce" stroke-dasharray="3 3"/><text x="22" y="${y(v)+3}" fill="#667773" font-size="9" text-anchor="end">${v.toFixed(1)}</text>`).join('')}<polyline points="${l.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}" stroke="#166b5b" stroke-width="2.5" fill="none"/>${l.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="#166b5b"/><text x="${x(i)}" y="${y(v)-8}" text-anchor="middle" fill="#17312e" font-size="10">${Number(v).toFixed(1)}</text><text x="${x(i)}" y="123" text-anchor="middle" fill="#667773" font-size="10">残${6-i}F</text>`).join('')}</svg>`}
function raceDetail(){const r=find(activeId);if(!r)return '<div class="empty">該当レースなし</div>';let delta=r.actual!=null&&r.predicted!=null?r.actual-r.predicted:null;return `<div class="bar"><button class="btn small" onclick="go('races')">‹ 一覧</button>${r.demo?demoTag(r):`<button class="btn small" onclick="editRace(${arg(r.id)})">レース編集</button>`}</div><div class="card"><div class="date">${esc(r.date)}　${esc(r.reviewStatus||'未確認')}</div><h2>${course(r)}</h2><p>${esc(r.name||'')}　${esc(r.raceClass||'')}　${esc(r.going||'')}</p>${biasPanel(r)}<div class="stats"><div class="stat"><span>予測33</span><b>${fmt(r.predicted)}</b></div><div class="stat"><span>実33</span><b>${fmt(r.actual)}</b></div><div class="stat"><span>実−予測</span><b>${fmt(delta)}</b></div></div>${r.effective!=null?`<div class="note">後続実効33（推定・別扱い）：${fmt(r.effective)}　${esc(r.effectiveBasis||'根拠未記入')}</div>`:''}${plot(r.laps)}${benchPanel(r)}<h3>33形成</h3><div class="note">${esc(r.formation||'未確認')}</div>${r.bias?`<p class="muted">馬場・隊列：${esc(r.bias)}</p>`:''}${r.note?`<p class="muted">${esc(r.note)}</p>`:''}</div><div class="subhead"><h2>馬別回顧 <small>${r.horses.length}/${r.fieldSize||'?'}</small></h2>${r.demo?'':`<button class="btn primary small" onclick="editHorse(${arg(r.id)})">＋ 馬追加</button>`}</div><div class="seg">${[['AB','注目中 A/B'],['archive','注目終了'],['all','全記録'],['C','C・記録のみ']].map(([v,t])=>`<button class="${gradeFilter===v?'on':''}" onclick="gradeFilter='${v}';render()">${t}</button>`).join('')}</div>${r.horses.filter(h=>gradeFilter==='archive'?isArchived(h):gradeOK(h,gradeFilter)&&(gradeFilter!=='AB'||isWatching(h))).sort((a,b)=>a.grade.localeCompare(b.grade)||a.number-b.number).map(h=>horseCard(r,h,true)).join('')||'<div class="empty">該当する馬別記録はありません。</div>'}`}
const WATCH_STATES=['注目中','継続','仮説的中','仮説不成立','注目終了'];const COMMENT_LIMIT=100;
function watchStatus(h){return WATCH_STATES.includes(h.watchStatus)?h.watchStatus:(['A','B'].includes(h.grade)?'注目中':'記録のみ')}
function isWatching(h){return ['A','B'].includes(h.grade)&&['注目中','継続'].includes(watchStatus(h))}
function isArchived(h){return ['仮説的中','仮説不成立','注目終了'].includes(watchStatus(h))}
function watchTag(h){return ['A','B'].includes(h.grade)||isArchived(h)?'<span class="tag '+(isArchived(h)?'watchArchive':'watchCurrent')+'">'+esc(watchStatus(h))+'</span>':''}
function groupHorses(items){let map=new Map();for(let x of items){let k=(x.r.demo?'demo:':'')+norm(x.h.name);if(!map.has(k))map.set(k,{key:k,name:x.h.name,items:[]});map.get(k).items.push(x)}for(let g of map.values())g.items.sort((a,b)=>b.r.date.localeCompare(a.r.date)||b.r.number-a.r.number);return [...map.values()].sort((a,b)=>b.items[0].r.date.localeCompare(a.items[0].r.date)||a.name.localeCompare(b.name,'ja'))}
function setWatch(e,id,n){e.preventDefault();let r=db.find(x=>x.id===id),h=r?.horses.find(x=>x.number===n);if(!h)return;let f=new FormData(e.target),status=String(f.get('watchStatus'));if(!WATCH_STATES.includes(status))return;h.watchStatus=status;h.watchNote=String(f.get('watchNote')||'').trim();h.watchUpdated=new Date().toISOString();save();if(page==='match'){render();runMatch()}else render();toast('注目状態を保存しました')}
function watchEditor(r,h){if(r.demo||!['A','B'].includes(h.grade)&&!isArchived(h))return '';return '<details class="watchEditor"><summary>注目状態を変更</summary><form onsubmit="setWatch(event,'+arg(r.id)+','+Number(h.number)+')"><label>状態</label><select name="watchStatus">'+opts(WATCH_STATES,watchStatus(h))+'</select><label>次走結果・終了理由（任意）</label><textarea name="watchNote" rows="2" placeholder="例：次走で好転条件が揃い、内容改善">'+esc(h.watchNote||'')+'</textarea><div class="actions"><button class="btn primary small" type="submit">状態を保存</button></div><small>終了・不成立・的中は注目一覧から除外。回顧記録は保持。</small></form></details>'}
function groupWatch(e,name){e.preventDefault();let f=new FormData(e.target),status=String(f.get('watchStatus'));if(!WATCH_STATES.includes(status))return;let active=db.flatMap(r=>r.horses).filter(h=>norm(h.name)===norm(name)&&isWatching(h));if(!active.length)return toast('注目中の記録はありません');if(!confirm(name+'の注目中 '+active.length+'件を「'+status+'」に変更しますか？'))return;let note=String(f.get('watchNote')||'').trim();for(let h of active){h.watchStatus=status;h.watchNote=note;h.watchUpdated=new Date().toISOString()}save();render();if(page==='match')runMatch();toast('注目状態を保存しました')}
function commentBody(r,h){let short=String(h.netComment||'').replace(/\s+/g,' ').trim().replace(/^\d{1,2}\/\d{1,2}\s*/,'');if(short)return short;let t=(h.tags||[]).filter(t=>t!=='展開恩恵');let chosen=t.slice(0,2).join('・');if(!chosen)return '次走条件確認';return chosen+(h.grade==='B'?'候補':'')}
function netComment(r,h){let date=r.date.slice(5).replace('-','/');let raw=date+' '+commentBody(r,h);return Array.from(raw).length<=COMMENT_LIMIT?raw:Array.from(raw).slice(0,COMMENT_LIMIT).join('')}
function netPending(){let rows=db.flatMap(r=>r.horses.map(h=>({r,h}))),registered=new Set(rows.filter(x=>x.h.registered).map(x=>norm(x.h.name)));return groupHorses(rows.filter(({h})=>isWatching(h)&&!registered.has(norm(h.name)))).map(g=>{let x=g.items[0];return {name:g.name,number:x.h.number,date:x.r.date,comment:netComment(x.r,x.h),count:g.items.length}})}
function netInstruction(list=netPending()){if(!list.length)return '';return ['以下の馬をnetkeibaの注目馬に新規登録してください。既に登録済みの馬は重複登録せず報告してください。コメント欄には下記のコメントだけを入力（開催日込み全角100文字以内）。登録に成功した馬名と未登録・エラーの馬名を分けて報告してください。文字数制限で入らない場合は日付を残し理由を短縮し、変更内容を報告してください。','馬名｜コメント',...list.map(x=>x.name+'｜'+x.comment)].join('\n')}
function copyNetInstruction(){let t=netInstruction();if(!t)return toast('未登録の実注目馬はありません');copy(t)}
function netPanel(){let list=netPending();return '<div class="card"><div class="row"><div class="grow"><h3>netkeiba 新規登録指示</h3><small>未登録・注目中 '+list.length+'頭（実データのみ）</small></div><button class="btn primary small" '+(!list.length?'disabled':'')+' onclick="copyNetInstruction()">AI指示文コピー</button></div><details class="historyDetails"><summary>登録一覧・コメント確認</summary><p class="muted">1頭1件、最新の注目回顧の日付＋短い理由。日付込み全角100文字以内（短文推奨）。コピーだけでは登録済にしません。</p><div class="netList">'+(list.map(x=>'<div><b>'+esc(x.name)+'</b><br><small>'+esc(x.comment)+'</small></div>').join('')||'<p class="muted">新規登録対象なし</p>')+'</div></details></div>'}
function gradeOK(h,g){return !g||g==='all'||(g==='AB'?['A','B'].includes(h.grade):h.grade===g)}
function horseCard(r,h,inRace=false){return `<div class="card"><div class="row"><div class="grow">${!inRace?`<div class="date">${esc(r.date)}　${course(r)}　${demoTag(r)}</div>`:''}<div class="name">${grade(h)} ${esc(h.number)} ${esc(h.name)} ${watchTag(h)}</div></div><div style="text-align:right"><b>${esc(h.finish||'—')}${/^\d+$/.test(h.finish||'')?'着':''}</b><div class="muted">${h.popularity!=null?esc(h.popularity)+'人気':''}</div></div></div><div style="margin:5px 0">${tags(h)}${!inRace?biasChips(r):''}</div>${h.watchNote?`<div class="muted">注目管理：${esc(h.watchNote)}</div>`:''}<div class="detailgrid"><div>実33 / コア33<b>${fmt(r.actual)} / ${esc(h.core||'未確認')}</b></div><div>33適合 / 位置<b>${esc(h.fit||'未確認')} / ${esc(h.position||'未確認')}</b></div><div>通過順<b>${esc(h.positions||'—')}</b></div><div>上がり / 着差<b>${esc(h.last3f??'—')} / ${esc(h.margin||'—')}</b></div></div><div class="note">${esc(h.reason||'回顧根拠未記入')}</div><div style="margin-top:8px"><small>次走の好転条件</small><div>${esc(h.next||'未設定')}</div></div><div class="row wrap" style="margin-top:9px"><span class="tag">${esc(h.evidence||'未確認')}</span>${h.registered?'<span class="tag good">netkeiba 登録済</span>':'<span class="tag">netkeiba 未登録</span>'}</div><div class="actions">${!inRace?`<button class="btn small" onclick="openRace(${arg(r.id)})">レース詳細</button>`:''}${r.demo?'':`<button class="btn small" onclick="editHorse(${arg(r.id)},${Number(h.number)})">編集</button><button class="btn small" onclick="toggleRegistered(${arg(h.name)},${!h.registered})">${h.registered?'登録済を解除':'登録済にする'}</button>`}</div>${watchEditor(r,h)}</div>`}
function toggleRegistered(name,value){db.forEach(r=>r.horses.forEach(h=>{if(norm(h.name)===norm(name))h.registered=value}));save();render();if(page==='match')runMatch();toast(value?'登録済と記録しました（netkeibaへの登録操作は別途必要）':'登録済フラグを解除しました')}
let horseReg='';
function horseList(){let universe=flat(),items=universe.filter(({h})=>(horseMode==='active'?isWatching(h):horseMode==='archive'?isArchived(h):['A','B'].includes(h.grade)||isArchived(h))&&gradeOK(h,gradeFilter)&&(!horseReg||(horseReg==='yes'?h.registered:!h.registered))&&(!horseQuery||norm(h.name).includes(norm(horseQuery))));let groups=groupHorses(items);return '<div class="bar"><h2>次走注目馬</h2></div>'+netPanel()+'<div class="seg">'+[['active','注目中'],['archive','終了履歴'],['all','すべて']].map(([v,t])=>'<button class="'+(horseMode===v?'on':'')+'" onclick="horseMode='+arg(v)+';gradeFilter='+arg(v==='archive'?'all':'AB')+';render()">'+t+'</button>').join('')+'</div><div class="seg">'+[['AB','A/B'],['A','Aのみ'],['B','Bのみ'],['all','全評価']].map(([v,t])=>'<button class="'+(gradeFilter===v?'on':'')+'" onclick="gradeFilter='+arg(v)+';render()">'+t+'</button>').join('')+'</div><div class="card compact fields"><div><label>馬名</label><input value="'+esc(horseQuery)+'" placeholder="部分一致" onchange="horseQuery=this.value;render()"></div><div><label>netkeiba</label><select onchange="horseReg=this.value;render()">'+opts([['','すべて'],['no','未登録'],['yes','登録済']],horseReg)+'</select></div></div><p class="watchCount">'+groups.length+'頭 / '+items.length+'件（同一馬を集約）</p>'+(groups.map(g=>horseGroupCard(g,universe)).join('')||'<div class="empty">該当する注目馬なし</div>')}
function horseGroupCard(g,universe){let x=g.items[0],h=x.h,r=x.r,history=universe.filter(y=>(y.r.demo?'demo:':'')+norm(y.h.name)===g.key),active=history.filter(y=>isWatching(y.h));let reg=history.some(y=>y.h.registered),count=history.length;let actions=r.demo?'':'<div class="actions"><button class="btn small" onclick="toggleRegistered('+arg(h.name)+','+!reg+')">'+(reg?'登録済を解除':'登録済にする')+'</button>'+ (isWatching(h)?'<button class="btn small" onclick="copy('+arg(netComment(r,h))+')">コメントコピー</button>':'')+'</div>';let groupEditor=r.demo||!active.length?'':'<details class="watchEditor"><summary>この馬の注目をまとめて変更（'+active.length+'件）</summary><form onsubmit="groupWatch(event,'+arg(h.name)+')"><label>状態</label><select name="watchStatus">'+opts(WATCH_STATES,'注目終了')+'</select><label>次走結果・終了理由</label><textarea name="watchNote" rows="2"></textarea><div class="actions"><button type="submit" class="btn primary small">まとめて保存</button></div></form></details>';return '<div class="card watchSummary"><div class="row"><div class="grow"><div class="name">'+grade(h)+' '+esc(h.number)+' '+esc(h.name)+' '+watchTag(h)+'</div><div class="date">'+esc(r.date)+'　'+course(r)+'　'+demoTag(r)+'</div></div><div class="muted">'+count+'走</div></div><div>'+tags(h)+'</div><div class="note">'+esc(h.reason||'回顧根拠未記入')+'</div><div class="muted" style="margin-top:5px">好転条件：'+esc(h.next||'未設定')+'</div>'+(h.watchNote?'<p class="muted">注目管理：'+esc(h.watchNote)+'</p>':'')+'<div class="row wrap"><span class="tag">'+(reg?'netkeiba 登録済':'netkeiba 未登録')+'</span><span class="tag">注目中 '+active.length+'件</span></div>'+actions+groupEditor+'<details class="historyDetails"><summary>全回顧履歴 '+count+'走（個別の注目変更・編集）</summary>'+history.map(y=>horseCard(y.r,y.h)).join('')+'</details></div>'}
function copyNames(){copyNetInstruction()}
async function copy(s){try{await navigator.clipboard.writeText(s);toast('コピーしました')}catch(e){const t=document.createElement('textarea');t.value=s;t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch{}t.remove();if(ok)toast('コピーしました');else{prompt('以下を選択してコピーしてください',s)}}}
const opts=(a,v)=>a.map(e=>{let [k,t]=Array.isArray(e)?e:[e,e];return `<option value="${esc(k)}" ${String(k)===String(v)?'selected':''}>${esc(t)}</option>`}).join('');
function searchPage(){let s=searchState;return `<div class="bar"><h2>条件検索</h2><button class="btn small" onclick="resetSearch()">リセット</button></div><div class="card fields"><div class="wide"><label>馬名（部分一致）</label><input value="${esc(s.q)}" oninput="searchState.q=this.value;updateSearch()" placeholder="馬名を入力"></div><div><label>前走・回顧時の芝ダ</label><select onchange="searchState.surface=this.value;updateSearch()">${opts([['','すべて'],'芝','ダート'],s.surface)}</select></div><div><label>回顧時の距離</label><select onchange="searchState.distance=this.value;updateSearch()">${opts([['','全距離'],...DISTS.map(d=>[d,d+'m'])],s.distance)}</select></div><div><label>競馬場</label><select onchange="searchState.place=this.value;updateSearch()">${opts([['','全場'],...PLACES],s.place)}</select></div><div><label>回顧時のクラス</label><select onchange="searchState.raceClass=this.value;updateSearch()">${opts([['','全クラス'],...CLASS_TABS.slice(1)],s.raceClass)}</select></div><div><label>顕著な馬場バイアス</label><select onchange="searchState.biasTag=this.value;updateSearch()">${opts([['','すべて'],...BIAS_TAGS],s.biasTag)}</select></div><div><label>注目度</label><select onchange="searchState.grade=this.value;updateSearch()">${opts([['all','全記録'],['AB','A/B'],'A','B','C'],s.grade)}</select></div><div><label>開始日</label><input type="date" value="${esc(s.start)}" onchange="searchState.start=this.value;updateSearch()"></div><div><label>終了日</label><input type="date" value="${esc(s.end)}" onchange="searchState.end=this.value;updateSearch()"></div><div><label>確認根拠</label><select onchange="searchState.evidence=this.value;updateSearch()">${opts([['','すべて'],...SOURCES],s.evidence)}</select></div><div><label>タグ条件</label><select onchange="searchState.mode=this.value;updateSearch()">${opts([['all','すべて一致（AND）'],['any','いずれか一致（OR）']],s.mode)}</select></div><div class="wide"><label>回顧タグ</label><div class="checks">${TAGS.map(t=>`<label><input type="checkbox" ${s.tags.includes(t)?'checked':''} onchange="searchTag(${arg(t)},this.checked)">${esc(t)}</label>`).join('')}</div></div></div><div id="searchResults">${searchResults()}</div>`}
function resetSearch(){searchState={biasTag:'',raceClass:'',q:'',surface:'',distance:'',place:'',grade:'AB',tags:[],mode:'all',registered:'',evidence:'',start:'',end:''};render()}
function searchTag(t,b){let a=searchState.tags;searchState.tags=b?[...a,t]:a.filter(v=>v!==t);updateSearch()}
function updateSearch(){$('searchResults').innerHTML=searchResults()}
function searchResults(){let s=searchState,items=flat().filter(({r,h})=>(!s.q||norm(h.name).includes(norm(s.q)))&&(!s.surface||r.surface===s.surface)&&(!s.distance||Number(r.distance)===Number(s.distance))&&(!s.place||r.place===s.place)&&classOK(r,s.raceClass)&&(!s.biasTag||biasTags(r).includes(s.biasTag))&&(!s.start||r.date>=s.start)&&(!s.end||r.date<=s.end)&&(!s.evidence||h.evidence===s.evidence)&&gradeOK(h,s.grade)&&(!s.tags.length||(s.mode==='all'?s.tags.every(t=>h.tags.includes(t)):s.tags.some(t=>h.tags.includes(t)))));return `<p class="muted">${items.length}件（過去の回顧条件で抽出）</p>${items.map(({r,h})=>horseCard(r,h)).join('')||'<div class="empty">該当する記録なし</div>'}`}
function matchPage(){return `<div class="bar"><h2>次走出走馬照合</h2></div><div class="card"><p>出走馬名を1行1頭で貼り付けると、過去の回顧記録を馬名で照合します。</p><textarea id="matchInput" rows="7" placeholder="例：サンプルホースA\nサンプルホースB" oninput="matchText=this.value">${esc(matchText)}</textarea><div class="actions"><button class="btn primary" onclick="runMatch()">照合する</button><button class="btn" onclick="matchText=['サンプルホースA','サンプルホースB'].join(String.fromCharCode(10));render();runMatch()">架空例を試す</button></div><label class="row"><input type="checkbox" ${matchHistory?'checked':''} onchange="matchHistory=this.checked;runMatch()">終了・記録のみも照合する</label><p class="muted">初期表示は注目中のみ。現段階は手動貼り付け。MY KEIBA LAB・netkeibaとの自動連携は未実装。馬名完全一致（空白・全半角を正規化）。</p></div><div id="matches"></div>`}
function runMatch(){let names=[...new Set(matchText.split(/[\n,、]+/).map(x=>norm(x.replace(/^\s*[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱]|^\s*\d{1,2}[\s.、:：]+/,'')).trim()).filter(Boolean))];let items=flat().filter(({h})=>names.includes(norm(h.name))&&(matchHistory||isWatching(h)));let hit=new Set(items.map(({h})=>norm(h.name)));$('matches').innerHTML=`<p class="muted">照合 ${names.length}頭中 ${hit.size}頭 / ${items.length}記録</p>${groupHorses(items).map(g=>horseGroupCard(g,flat())).join('')||'<div class="empty">一致する回顧記録なし</div>'}${names.filter(n=>!hit.has(n)).length?`<div class="card muted">記録なし：${esc(names.filter(n=>!hit.has(n)).join('、'))}</div>`:''}`}
let editId=null,editNum=null;
function editRace(id=null){editId=id;page='raceform';render();window.scrollTo(0,0)}
function field(label,name,val,type='text',wide=false,extra=''){return `<div class="${wide?'wide':''}"><label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" value="${esc(val??'')}" ${extra}></div>`}
function sel(label,name,values,val,wide=false){return `<div class="${wide?'wide':''}"><label for="${name}">${label}</label><select id="${name}" name="${name}">${opts(values,val)}</select></div>`}
function area(label,name,val,extra=''){return `<div class="wide"><label for="${name}">${label}</label><textarea id="${name}" name="${name}" ${extra}>${esc(val??'')}</textarea></div>`}
function raceForm(){let r=db.find(x=>x.id===editId)||{date:new Date(Date.now()+9*3600000).toISOString().slice(0,10),place:'福島',number:'',surface:'芝',reviewStatus:'未確認'};return `<div class="bar"><h2>${editId?'レース編集':'レース登録'}</h2><button class="btn small" onclick="${editId?'openRace('+arg(editId)+')':"go('races')"}">戻る</button></div><form class="card" onsubmit="submitRace(event)"><div class="fields">${field('開催日','date',r.date,'date',false,'required')}${sel('競馬場','place',PLACES,r.place)}${field('レース番号','number',r.number,'number',false,'min="1" max="12" required')}${field('レース名','name',r.name)}${sel('芝・ダート','surface',['芝','ダート'],r.surface)}${field('距離（m）','distance',r.distance,'number',false,'min="600" max="5000" required')}${sel('馬場状態','going',[['','未確認'],'良','稍重','重','不良'],r.going||'')}${sel('クラス','raceClass',[['','未確認'],'新馬','2歳未勝利','3歳未勝利','未勝利','2歳1勝','1勝','2勝','3勝','OP','L','G3','G2','G1','重賞',...(r.raceClass&&!['新馬','2歳未勝利','3歳未勝利','未勝利','2歳1勝','1勝','2勝','3勝','OP','L','G3','G2','G1','重賞'].includes(r.raceClass)?[r.raceClass]:[])],r.raceClass||'')}${field('出走頭数','fieldSize',r.fieldSize,'number',false,'min="1" max="30"')}${sel('回顧状況','reviewStatus',['未確認','一次回顧済','二次回顧中','回顧完了'],r.reviewStatus)}${field('事前予測33','predicted',r.predicted,'number',false,'step="0.1"')}${field('実33（6F入力時は自動計算）','actual',r.actual,'number',false,'step="0.1"')}${field('ラスト6F（空白区切り）','laps',(r.laps||[]).join(' '),'text',true,'placeholder="12.0 12.1 12.2 12.5 12.8 13.1" oninput="preview33()"')}<div class="wide muted" id="lapPreview">6F入力で実33を算出（前半3F−後半3F）。</div>${field('後続実効33（推定、任意）','effective',r.effective,'number',false,'step="0.1"')}${field('実効33の根拠','effectiveBasis',r.effectiveBasis)}${area('33形成・緩み・再加速・減速','formation',r.formation)}${area('馬場・隊列の推定／回顧メモ','bias',r.bias)}${biasFields(r)}${area('補足・事前予想との差','note',r.note)}${benchFields(r)}</div><div class="actions"><button class="btn primary" type="submit">保存</button>${editId?'<button type="button" class="btn danger" onclick="deleteRace()">削除</button>':''}</div></form>`}
function parseLaps(s){return s.trim()?s.trim().split(/[\s,、]+/).map(Number):[]}
function preview33(){let n=sum33(parseLaps($('laps').value));$('lapPreview').textContent=n===null?'6個の数値を入力してください（未入力でも保存可）。':'自動計算 実33：'+fmt(n);if(n!==null)$('actual').value=n}
function submitRace(e){e.preventDefault();let fd=new FormData(e.target),f=Object.fromEntries(fd),old=db.find(r=>r.id===editId);let l=parseLaps(f.laps);if(l.length&&(sum33(l)===null||l.some(x=>x<=0)))return toast('ラスト6Fは正の数値6個で入力してください');let bench;try{bench=readBench(f)}catch(e){return toast(e.message)}let r={...old,...f,...bench,userBiasTags:checkedBias(fd.getAll('userBiasTags')),number:Number(f.number),distance:Number(f.distance),fieldSize:num(f.fieldSize),predicted:num(f.predicted),actual:l.length?sum33(l):num(f.actual),effective:num(f.effective),laps:l,horses:old?.horses||[]};r.id=raceId(r);if(db.some(x=>x.id===r.id&&x.id!==editId))return toast('同じ開催日・競馬場・Rが登録済です');db=old?db.map(x=>x.id===editId?r:x):[...db,r];save();openRace(r.id);toast('レースを保存しました')}
function deleteRace(){if(!confirm('このレースと馬別回顧を削除しますか？'))return;db=db.filter(r=>r.id!==editId);save();go('races')}
function editHorse(id,n=null){editId=id;editNum=n;page='horseform';render();window.scrollTo(0,0)}
function horseForm(){let r=db.find(x=>x.id===editId);if(!r)return '<div class="empty">対象レースなし</div>';let h=r.horses.find(x=>x.number===editNum)||{grade:'C',fit:'未確認',position:'未確認',evidence:'未確認',tags:[]};return `<div class="bar"><h2>${editNum?'馬別回顧 編集':'馬別回顧 登録'}</h2><button class="btn small" onclick="openRace(${arg(r.id)})">戻る</button></div><p class="muted">${esc(r.date)} ${course(r)}　実33 ${fmt(r.actual)}</p><form class="card" onsubmit="submitHorse(event)"><div class="fields">${field('馬番','number',h.number,'number',false,'required min="1" max="30"')}${field('馬名','name',h.name,'text',false,'required')}${field('着順（中止等も可）','finish',h.finish)}${field('人気','popularity',h.popularity,'number',false,'min="1" max="30"')}${field('着差','margin',h.margin)}${field('通過順','positions',h.positions,'text',false,'placeholder="2-2-3-4"')}${field('上がり3F（秒）','last3f',h.last3f,'number',false,'step="0.1" min="0"')}${field('コア33帯','core',h.core)}${sel('33適合','fit',['未確認','一致','好走可能','不一致','中間'],h.fit)}${sel('位置取り評価','position',['未確認','有利','中立','不利'],h.position)}${sel('次走注目度','grade',[['A','A：積極注目'],['B','B：条件付き'],['C','C：記録のみ']],h.grade)}${sel('確認根拠','evidence',SOURCES,h.evidence)}<div class="wide"><label>不利・能力タグ（複数選択）</label><div class="checks">${TAGS.map(t=>`<label><input type="checkbox" name="tags" value="${esc(t)}" ${h.tags.includes(t)?'checked':''}>${esc(t)}</label>`).join('')}</div></div>${area('回顧根拠・不利の程度','reason',h.reason)}${area('次走の好転条件','next',h.next)}${field('netkeiba短い理由（任意・日付不要）','netComment',h.netComment,'text',true,'maxlength="94" placeholder="例：33不一致・位置不利。流れる展開で再注目"')}<div class="wide"><label class="row"><input name="registered" type="checkbox" ${h.registered?'checked':''}>netkeibaへ登録済（手動記録）</label></div></div><div class="actions"><button class="btn primary" type="submit">保存</button>${editNum?'<button class="btn danger" type="button" onclick="deleteHorse()">削除</button>':''}</div></form>`}
function submitHorse(e){e.preventDefault();let fd=new FormData(e.target),f=Object.fromEntries(fd),r=db.find(x=>x.id===editId);let prev=r.horses.find(x=>x.number===editNum);let h={...prev,...f,name:f.name.trim(),number:Number(f.number),popularity:num(f.popularity),last3f:num(f.last3f),tags:fd.getAll('tags'),registered:fd.has('registered')};if(!h.name)return toast('馬名を入力してください');if(r.horses.some(x=>x.number===h.number&&x.number!==editNum))return toast('同じ馬番が登録済です');if(r.horses.some(x=>norm(x.name)===norm(h.name)&&x.number!==editNum))return toast('同じ馬名が登録済です');if(editNum===null){h.registered=h.registered||db.some(x=>x.horses.some(y=>norm(y.name)===norm(h.name)&&y.registered));r.horses.push(h)}else r.horses=r.horses.map(x=>x.number===editNum?h:x);db.forEach(x=>x.horses.forEach(y=>{if(norm(y.name)===norm(h.name))y.registered=h.registered}));save();openRace(r.id);toast('馬別回顧を保存しました')}
function deleteHorse(){if(!confirm('馬別回顧を削除しますか？'))return;let r=db.find(x=>x.id===editId);r.horses=r.horses.filter(h=>h.number!==editNum);save();openRace(r.id)}
const template={schema:SCHEMA,races:[{date:'2026-11-21',place:'福島',number:10,name:'',surface:'ダート',distance:1700,going:'',raceClass:'',timeBase:null,timeActual:null,front3Base:null,front3Actual:null,front5Base:null,front5Actual:null,frontOtherMeters:null,frontOtherBase:null,frontOtherActual:null,last3Base:null,last3Actual:null,benchSource:'',fieldSize:null,reviewStatus:'一次回顧済',predicted:null,actual:null,effective:null,effectiveBasis:'',laps:[],formation:'',bias:'',note:'',horses:[{number:1,name:'実馬名に置換',finish:'',popularity:null,margin:'',positions:'',last3f:null,core:'',fit:'未確認',position:'未確認',grade:'C',tags:[],evidence:'未確認',reason:'',next:'',netComment:'',registered:false}]}]};
function dataPage(){return `<div class="bar"><h2>データ管理</h2></div><div class="card"><h3>ラップ君から一括登録</h3><p class="muted">指定形式のJSONを貼り付け、またはファイルから読み込み。同一開催日・場・Rは馬番単位で更新し、未入力の別馬は残します。取り込み前に件数を確認できます。</p><textarea id="importInput" rows="7" placeholder="KAIKO_DB_LAB_V1 / KAIKO_BIAS_UPDATE_V1 JSON" oninput="importText=this.value">${esc(importText)}</textarea><div class="actions"><button class="btn primary" onclick="importJSON()">内容確認・取り込み</button><button class="btn" onclick="copy(JSON.stringify(template,null,2))">JSON形式コピー</button><label class="btn" style="color:var(--ink);margin:0;cursor:pointer">ファイル選択<input type="file" accept=".json,application/json" style="display:none" onchange="loadFile(this)"></label></div><details style="margin-top:12px"><summary>ラップ君への依頼文をコピー</summary><p class="muted">保存済み事前予想と結果を照合し、実33・隊列・全頭の一次回顧から注目馬を抽出。確認できない項目は未確認・null。物理的不利は推測と確定を区別し、次走好転条件を付記。下記形式で出力。</p><button class="btn small" onclick="copy(promptText())">依頼文＋形式をコピー</button></details><details style="margin-top:12px"><summary>ユーザー指定の馬場バイアスだけ更新</summary><p class="muted">開催日・場・Rを指定したJSONを上の欄に貼り付け。既存の時計・馬別回顧には触れません。通常の回顧再取り込みでも指定済タグを保持します。</p><button class="btn small" onclick="copy(JSON.stringify(biasTemplate,null,2))">馬場バイアス更新形式をコピー</button></details></div><div class="card"><h3>バックアップ・復元</h3><p>実データ ${db.length}レース / ${db.reduce((s,r)=>s+r.horses.length,0)}馬別記録</p><button class="btn primary full" onclick="exportDB()">JSONバックアップを保存</button><p class="muted">同じJSONを上の取り込み欄で復元できます。データはこのブラウザ内に保存され、他端末と同期しません。定期的なJSON保存を推奨します。</p></div><div class="card"><h3>表示設定</h3><label class="row"><input type="checkbox" ${showDemo?'checked':''} onchange="showDemo=this.checked;render()">架空サンプルを表示</label><p class="muted">サンプルは実DB・バックアップ・馬名コピーに含まれません。</p></div>`}
function promptText(){return '回顧DB LAB登録用。対象レースの事前予想と結果を照合し、ラスト6Fの前半3F−後半3Fで実33を計算。全出走馬を一次確認し、33適合と位置不利、追走負荷、能力克服、展開恩恵を分離。映像未確認の物理的不利は疑いとして記載。A=積極注目、B=条件付き、C=記録のみ。根拠・次走好転条件を記録し、未確認はnullまたは未確認。馬名と馬番必須。芝ダ混同なし。大逃げ時は実効33を別欄に。新聞基準時計と実測時計は秒数で別記し、前半3F/5F以外はfrontOtherMetersで区間を特定。未確認値はnull。新聞の基準を推測で作らない。netkeiba用の短い理由をnetComment（任意、日付なし、94文字以内。短い理由と必要に応じて好転条件を簡潔に）に設定可。顕著な馬場バイアスはユーザーから明示された場合のみ指定。通常の一次回顧ではbiasに推定・根拠を記録し、ユーザー指定タグは別のKAIKO_BIAS_UPDATE_V1で更新。以下のJSON形式（サンプル値を実データに置換、複数レース・馬可）で出力。タグ選択肢：'+TAGS.join('、')+'。確認根拠：'+SOURCES.join('、')+'。\n'+JSON.stringify(template,null,2)}
async function loadFile(el){if(!el.files.length)return;try{importText=await el.files[0].text();$('importInput').value=importText;toast('ファイルを読み込みました。内容確認・取り込みを押してください')}catch{toast('読み込み失敗')}}
function validateRace(raw){if(!raw||typeof raw!=='object'||raw.demo||!/^\d{4}-\d{2}-\d{2}$/.test(raw.date)||!PLACES.includes(raw.place)||!Number.isInteger(Number(raw.number))||Number(raw.number)<1||Number(raw.number)>12||!['芝','ダート'].includes(raw.surface)||!Number.isFinite(Number(raw.distance))||Number(raw.distance)<600||!Array.isArray(raw.horses))throw Error('開催日・場・R・芝ダ・距離・horsesの形式を確認してください');let r={...raw,...readBench(raw),...(Object.hasOwn(raw,'userBiasTags')?{userBiasTags:checkedBias(raw.userBiasTags),userBiasNote:String(raw.userBiasNote??'')}:{}),number:Number(raw.number),distance:Number(raw.distance),predicted:num(raw.predicted),actual:num(raw.actual),effective:num(raw.effective),fieldSize:num(raw.fieldSize),laps:raw.laps||[],horses:[]};if(r.laps.length){if(sum33(r.laps)===null||r.laps.some(x=>Number(x)<=0))throw Error('ラスト6Fは正の数値6個');r.laps=r.laps.map(Number);r.actual=sum33(r.laps)}if([r.predicted,r.actual,r.effective,r.fieldSize].some(x=>x!==null&&!Number.isFinite(x)))throw Error('33または出走頭数が数値ではありません');r.id=raceId(r);let used=new Set(),names=new Set();r.horses=raw.horses.map(h=>{if(!h||!Number.isInteger(Number(h.number))||Number(h.number)<1||Number(h.number)>30||typeof h.name!=='string'||!h.name.trim()||h.name==='実馬名に置換'||!['A','B','C'].includes(h.grade)||!Array.isArray(h.tags)||h.tags.some(t=>!TAGS.includes(t)))throw Error('馬番・馬名・A/B/C・タグを確認してください');let n=Number(h.number),name=norm(h.name);if(used.has(n)||names.has(name))throw Error('同一レース内の馬番・馬名重複');used.add(n);names.add(name);let o={...h,name:h.name.trim(),number:n,finish:String(h.finish??''),margin:String(h.margin??''),popularity:num(h.popularity),last3f:num(h.last3f),registered:h.registered===true};if(Object.hasOwn(o,'watchStatus')&&!WATCH_STATES.includes(o.watchStatus))delete o.watchStatus;if([o.popularity,o.last3f].some(x=>x!==null&&!Number.isFinite(x)))throw Error('人気・上がりの数値を確認してください');return o});return r}
function importJSON(){try{let v=JSON.parse(importText.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,''));if(v.schema===BIAS_SCHEMA)return importBias(v);if(v.schema!==SCHEMA||!Array.isArray(v.races)||!v.races.length)throw Error('KAIKO_DB_LAB_V1のraces配列が必要です');let incoming=v.races.map(validateRace);let draft=JSON.parse(JSON.stringify(db)),added=0,updated=0;for(let r of incoming){let ix=draft.findIndex(x=>x.id===r.id);if(ix===-1){draft.push(r);added++}else{let old=draft[ix];let horses=[...old.horses];for(let h of r.horses){let i=horses.findIndex(x=>x.number===h.number);if(i>=0&&norm(horses[i].name)!==norm(h.name))throw Error('同一レース・馬番で馬名が異なります：'+h.name);if(horses.some(x=>x.number!==h.number&&norm(x.name)===norm(h.name)))throw Error('同じ馬名の馬番が異なります：'+h.name);if(i>=0){let prev=horses[i],mergedHorse={...prev,...h,registered:prev.registered||h.registered};for(let k of ['watchStatus','watchNote','watchUpdated','netComment'])if(Object.hasOwn(prev,k))mergedHorse[k]=prev[k];horses[i]=mergedHorse}else horses.push(h)}let merged={...old,...r,horses};for(let k of [...BENCH_KEYS,'benchSource'])if((r[k]==null||r[k]==='')&&old[k]!=null)merged[k]=old[k];if(Object.hasOwn(old,'userBiasTags')){merged.userBiasTags=old.userBiasTags;merged.userBiasNote=old.userBiasNote??''}draft[ix]=merged;updated++}}let registered=new Set(draft.flatMap(r=>r.horses).filter(h=>h.registered).map(h=>norm(h.name)));draft.forEach(r=>r.horses.forEach(h=>{if(registered.has(norm(h.name)))h.registered=true}));if(!confirm(`新規 ${added}レース / 更新 ${updated}レース / 入力馬別 ${incoming.reduce((s,r)=>s+r.horses.length,0)}件。取り込みますか？`))return;db=draft;save();importText='';go('races');toast('取り込み完了')}catch(e){alert('取り込みできません：'+e.message)}}
function exportDB(){let b=new Blob([JSON.stringify({schema:SCHEMA,races:db},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='kaiko_db_lab_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('バックアップを出力しました')}
render();
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'}).catch(e=>console.warn('回顧DB LAB PWA:',e));});}</script></body></html>
