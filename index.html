<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1612" />
  <meta name="description" content="自分専用の競馬予想・分析メモ" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <title>MY KEIBA LAB</title>
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">PERSONAL RACING ANALYSIS</p>
      <h1>MY KEIBA LAB</h1>
    </div>
    <button id="exportBtn" class="icon-btn" aria-label="データを書き出す">保存</button>
  </header>

  <main class="app-shell">
    <section class="hero-card">
      <div>
        <span class="pill">第1版</span>
        <h2>穴候補を、条件で絞る。</h2>
        <p>KTM・33ラップ・調教・人気・馬場を1画面で整理する、自分専用の予想ノートです。</p>
      </div>
      <div class="hero-actions">
        <button id="newRaceBtn" class="primary-btn">＋ レース追加</button>
        <label class="secondary-btn file-label">データ読込<input id="importInput" type="file" accept="application/json" hidden /></label>
      </div>
    </section>

    <section class="summary-grid" aria-label="集計">
      <article class="summary-card"><span>登録レース</span><strong id="raceCount">0</strong></article>
      <article class="summary-card"><span>KTM</span><strong id="ktmCount">0</strong></article>
      <article class="summary-card"><span>穴注目</span><strong id="valueCount">0</strong></article>
    </section>

    <section class="section-head">
      <div>
        <p class="eyebrow">RACE BOARD</p>
        <h2>レース一覧</h2>
      </div>
      <button id="demoBtn" class="text-btn">サンプルを見る</button>
    </section>

    <section id="raceList" class="race-list" aria-live="polite"></section>

    <section id="emptyState" class="empty-state">
      <div class="empty-icon">◎</div>
      <h3>まだレースがありません</h3>
      <p>「レース追加」から、開催場・レース名・馬場・各馬の調教情報を登録できます。</p>
      <button class="primary-btn" data-action="new-race">最初のレースを作る</button>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="メインナビゲーション">
    <button class="nav-item active" data-filter="all"><span>一覧</span></button>
    <button class="nav-item" data-filter="ktm"><span>KTM</span></button>
    <button class="nav-item" data-filter="value"><span>穴注目</span></button>
  </nav>

  <dialog id="raceDialog" class="sheet-dialog">
    <form id="raceForm" method="dialog" class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title-row">
        <div><p class="eyebrow">NEW RACE</p><h2 id="dialogTitle">レース登録</h2></div>
        <button type="button" class="icon-btn" data-close>閉じる</button>
      </div>

      <input id="raceId" type="hidden" />
      <div class="form-grid two">
        <label>開催場<input id="track" required placeholder="例：中山" /></label>
        <label>R<select id="raceNo"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option selected>11</option><option>12</option></select></label>
      </div>
      <label>レース名<input id="raceName" required placeholder="例：○○ステークス" /></label>
      <div class="form-grid two">
        <label>天気<select id="weather"><option>晴</option><option>曇</option><option>小雨</option><option>雨</option><option>雪</option></select></label>
        <label>馬場<select id="going"><option>良</option><option>稍重</option><option>重</option><option>不良</option></select></label>
      </div>
      <label>展開メモ<textarea id="paceMemo" rows="2" placeholder="例：先行多め。前半速くなりそう"></textarea></label>

      <div class="horses-head">
        <div><p class="eyebrow">HORSES</p><h3>出走馬メモ</h3></div>
        <button id="addHorseBtn" type="button" class="secondary-btn small">＋ 馬追加</button>
      </div>
      <div id="horseEditor" class="horse-editor"></div>

      <div class="sheet-actions">
        <button type="button" class="danger-btn" id="deleteRaceBtn" hidden>削除</button>
        <button type="submit" class="primary-btn grow">保存する</button>
      </div>
    </form>
  </dialog>

  <template id="horseFormTemplate">
    <article class="horse-form-card">
      <div class="horse-form-top">
        <strong>馬データ</strong>
        <button type="button" class="remove-horse text-btn">削除</button>
      </div>
      <div class="form-grid two">
        <label>馬名<input class="h-name" placeholder="馬名" /></label>
        <label>人気<input class="h-pop" type="number" min="1" placeholder="例：8" /></label>
      </div>
      <div class="form-grid three">
        <label>調教印<select class="h-mark"><option value="">—</option><option>◎</option><option>○</option><option>▲</option><option>△</option><option>×</option></select></label>
        <label>前走比<input class="h-diff" type="number" step="1" placeholder="+6" /></label>
        <label>33ラップ<select class="h-lap"><option value="">—</option><option>S</option><option>A</option><option>B</option><option>C</option></select></label>
      </div>
      <div class="form-grid two">
        <label>オッズ<input class="h-odds" type="number" min="1" step="0.1" placeholder="例：18.4" /></label>
        <label>脚質<select class="h-style"><option value="">—</option><option>逃げ</option><option>先行</option><option>差し</option><option>追込</option></select></label>
      </div>
      <label>メモ<textarea class="h-note" rows="2" placeholder="好走条件、前走不利、装具など"></textarea></label>
    </article>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
