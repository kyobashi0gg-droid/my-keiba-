<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MY KEIBA LAB 更新</title>
  <style>body{margin:0;display:grid;place-items:center;min-height:100vh;background:#08110e;color:#f4f7f5;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}main{text-align:center;padding:24px}p{color:#9fb2a8;line-height:1.7}</style>
</head>
<body>
<main><h2>MY KEIBA LAB を更新しています</h2><p>古いキャッシュを削除して最新版を開きます。</p></main>
<script>
(async()=>{
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch(e) {}
  location.replace('./?fresh=' + Date.now());
})();
</script>
</body>
</html>
